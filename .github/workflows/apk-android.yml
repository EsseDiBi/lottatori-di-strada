# Costruisce l'app Android (APK) di Lottatori di Strada a ogni aggiornamento del gioco
# e la pubblica in GitHub Releases con nome fisso, cosi' il link di download non cambia.
name: App Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'img/**', 'app-android/**', '.github/workflows/apk-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepara i file del gioco
        run: |
          mkdir -p build/www
          cp -r index.html img icona-192.png icona-512.png manifest.webmanifest build/www/
          # dentro l'app il tasto "Installa" non serve
          python3 -c "p='build/www/index.html';s=open(p).read();s=s.replace('</body>','<style>#ldsInstall{display:none!important}</style></body>',1);open(p,'w').write(s)"

      - name: Crea il progetto Android
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Lottatori di Strada" it.essedibi.lottatori --web-dir www
          npx cap add android
          npx cap sync android

      - name: Schermo orizzontale, schermo intero, icona
        working-directory: build/android
        run: |
          cp ../../app-android/MainActivity.java app/src/main/java/it/essedibi/lottatori/MainActivity.java
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' app/src/main/AndroidManifest.xml
          rm -rf app/src/main/res/mipmap-anydpi-v26
          for d in app/src/main/res/mipmap-*; do
            cp ../../icona-192.png $d/ic_launcher.png
            cp ../../icona-192.png $d/ic_launcher_round.png
            rm -f $d/ic_launcher_foreground.png
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle

      - name: Firma fissa (cosi' gli aggiornamenti si installano sopra)
        working-directory: build/android
        run: |
          cp ../../app-android/firma.keystore app/firma.keystore
          python3 - <<'PY'
          p='app/build.gradle'; s=open(p).read()
          cfg="android {\n    signingConfigs {\n        debug {\n            storeFile file('firma.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n"
          assert s.count('android {')>=1
          s=s.replace('android {',cfg,1)
          open(p,'w').write(s)
          PY
          grep -n -A6 signingConfigs app/build.gradle

      - name: Costruisci l'APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../lottatori-di-strada.apk

      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Lottatori di Strada per Android
          body: "App Android del gioco, aggiornata in automatico. Versione 1.${{ github.run_number }}, gioco ${{ github.sha }}."
          files: lottatori-di-strada.apk
          make_latest: true
